name: Build APK Preview
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Recreate correct project structure
        run: |
          mkdir -p app/src/main/java/com/example/reberwetjss
          cp -r *.kt app/src/main/java/com/example/reberwetjss/ 2>/dev/null || true
          if [ -f AndroidManifest.xml ]; then cp AndroidManifest.xml app/src/main/AndroidManifest.xml; fi

          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
            id("com.android.application") version "8.2.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat > app/build.gradle.kts << 'EOF'
          plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
          }
          android {
            namespace = "com.example.reberwetjss"
            compileSdk = 34
            defaultConfig {
              applicationId = "com.example.reberwetjss"
              minSdk = 21
              targetSdk = 34
              versionCode = 1
              versionName = "1.0"
            }
            compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.appcompat:appcompat:1.6.1")
            implementation("com.google.android.material:material:1.11.0")
          }
          EOF
          ls -R
      - name: Build APK
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReberwetJS-Preview-APK
          path: "**/build/outputs/apk/debug/*.apk"
