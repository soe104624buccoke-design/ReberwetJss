name: Build APK Preview
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Fix project structure
        run: |
          mkdir -p app/src/main/java
          mkdir -p app/src/main
          cp build.gradle.kts app/build.gradle.kts 2>/dev/null || true
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml 2>/dev/null || true
          cp *.kt app/src/main/java/ 2>/dev/null || true
          cp gradle.properties app/ 2>/dev/null || true
          cp proguard-rules.pro app/ 2>/dev/null || true
          echo 'include(":app")' > settings.gradle.kts
          ls -R
      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReberwetJS-Preview-APK
          path: "**/build/outputs/apk/debug/*.apk"
