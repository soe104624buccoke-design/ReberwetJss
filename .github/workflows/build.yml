name: Build APK Preview
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Fix build but KEEP your MainActivity
        run: |
          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
            id("com.android.application") version "8.2.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # This FIXES your app/build.gradle but DOES NOT delete MainActivity
          cat > app/build.gradle.kts << 'EOF'
          plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
          }
          android {
            namespace = "com.example.reberwetjss"
            compileSdk = 34
            defaultConfig {
              applicationId = "com.example.reberwetjss"
              minSdk = 21
              targetSdk = 34
              versionCode = 5
              versionName = "1.4"
            }
          }
          dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.appcompat:appcompat:1.6.1")
          }
          EOF
      - name: Build APK
        run: |
          gradle wrapper
          chmod +x gradlew
           ./gradlew :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReberwetJS-KEEP-YOUR-FILES
          path: "**/build/outputs/apk/debug/*.apk"
